repos:
  - repo: local
    hooks:
      - id: pnpm-lint-fix
        name: pnpm-lint-fix
        description: Runs ESLint and Prettier auto-fix on JS/TS/JSON/MD files.
        entry: pnpm run --silent lint:fix
        language: system
        pass_filenames: false
        files: \.(js|ts|tsx|json|md)$

      - id: golangci-lint-full
        name: golangci-lint-full
        description: Fast linters runner for Go. Runs on all files in the module.
        entry: golangci-lint run --fix
        language: system
        require_serial: true
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        args: ['--fix']
