repos:
  - repo: local
    hooks:
      - id: pnpm-lint-fix
        name: pnpm-lint-fix
        description: Runs ESLint and Prettier auto-fix on JS/TS/JSON files.
        entry: pnpm run --silent lint:fix
        language: system
        pass_filenames: false
        files: \.(js|ts|tsx|json)$

      - id: pnpm-lint-md-fix
        name: pnpm-lint-md-fix
        description: Runs markdownlint auto-fix using the same pnpm-managed toolchain and config as CI.
        entry: pnpm run --silent lint:md:fix
        language: system
        pass_filenames: false
        files: \.md$

      - id: golangci-lint-full
        name: golangci-lint-full
        description: Fast linters runner for Go. Runs on all files in the module.
        entry: golangci-lint run --fix
        language: system
        require_serial: true
        pass_filenames: false
